    <template id="privacy-notice">
      <section class="shell" style="padding-top:36px">
        <h1 class="display">Privacy and storage</h1>
        <p class="copy">Last updated: <time datetime="2026-11-15">15 November 2026</time>.</p>
        <h2 class="display">Who runs this site</h2>
        <p class="copy">GameTrackDaily is run by Kol Tregaskes in the UK. For privacy enquiries or rights requests, use the existing <a href="https://koltregaskes.com/contact/">Contact Kol</a> route. That separate website has its own privacy arrangements.</p>
        <h2 class="display">Hosting and request logs</h2>
        <p class="copy">This static site is hosted on GitHub Pages. Requests reach GitHub, which may process IP addresses, user agents and standard request logs to deliver and secure the service. See <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub's privacy statement</a> for its handling and retention. We have not verified host-side settings or log retention. Cloudflare proxying is only a proposal awaiting Kol's approval; it is not the hosting arrangement described here.</p>
        <h2 class="display">Google Fonts</h2>
        <p class="copy">The stylesheet requests fonts from fonts.googleapis.com and fonts.gstatic.com. These requests send your IP address and request headers, including your user agent, to Google. See <a href="https://developers.google.com/fonts/faq/privacy">Google's Fonts privacy statement</a>. Fonts can be blocked in your browser; system fonts provide a fallback.</p>
        <h2 class="display">Browser storage</h2>
        <p class="copy">The site's code uses one localStorage key, <code>gtd-scanlines</code>, to remember whether the optional CRT scanline effect is on (1) or off (0). It is written when the page initialises and when you change the preference. It stays in your browser until you clear this site's storage and is not sent by the site's code to a server. Clear it through your browser's site-data controls to reset it. No other localStorage, sessionStorage, IndexedDB, service worker or cookie use was found in the site's code. Your browser may cache files as part of normal browsing.</p>
        <h2 class="display">Forms, accounts and analytics</h2>
        <p class="copy">The site's code contains no analytics, account registration or forms sending data. The project search form only filters content in your browser. This describes the site's code, not a guarantee about GitHub's or another provider's processing. Cookieless analytics is planned under work items #1498 and #367, but is not active. This notice must be reviewed before a collector is enabled.</p>
        <h2 class="display">Outbound links</h2>
        <p class="copy">Links lead to news sources, stores, official events, video sites, public demos, GitHub, social profiles and Kol's other sites. Following a link makes a request to that destination, whose own privacy and storage rules apply. The release data provider is <a href="https://www.igdb.com/">IGDB</a>; visiting it is also an outbound request. There are no embedded video players in the current site's code. Source URLs and publication dates in the downloaded manifests describe published material, not your browsing history.</p>
        <h2 class="display">Your rights</h2>
        <p class="copy">Under UK GDPR, you may have rights to be informed, access your personal data, correct it, request erasure, restrict processing, object, and receive portable data, depending on the processing and applicable conditions. Contact Kol using the route above about processing for which he is responsible. For provider-controlled logs, consult the relevant provider's privacy statement. You can complain to the <a href="https://ico.org.uk/make-a-complaint/">Information Commissioner's Office (ICO)</a>; see its <a href="https://ico.org.uk/for-the-public/">guidance on your information rights</a>.</p>
        <h2 class="display">Referenced hosts in the site code</h2>
        <p class="copy">This inventory distinguishes font requests from links and metadata identifiers. A listed link or identifier does not mean the browser contacts it automatically.</p>
